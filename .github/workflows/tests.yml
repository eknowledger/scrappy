# Fast feedback: the whole pytest suite on the Python Batocera v41 ships (3.11) and the next one (3.12).
# Nothing real is needed: no Batocera, no EmulationStation, no network. Steam, YouTube, ffmpeg's trailers, the
# installer's ssh and /userdata are all faked. The window tests run for real on Qt's offscreen platform.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  # 3.11 is what Batocera v41 runs (the only verified target) and the version the vendored Pillow wheels are built for;
  # 3.12 is the next one. One version is one point, not a range: when the supported range moves, move this list.
  test:
    name: unit tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Off: "fails on 3.11" and "fails on 3.12" are different findings, and cancelling one leg to report
      # the other hides which.
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: System libraries for Qt (offscreen) and ffmpeg
        # PyQt5's wheel needs these to start even without a display. ffmpeg is used by the trailer tests and by the
        # demo library's clips. Without either, whole test files skip, and a skipped window test is the one thing
        # this job must not do silently (see "The window tests ran" below).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 ffmpeg

      # PyQt5 is not in requirements-dev.txt on purpose: on Batocera it comes with the system Python, and nothing
      # in the program's own requirements may suggest it has to be installed there.
      - run: python -m pip install -r requirements-dev.txt PyQt5

      - name: Tests
        run: python -m pytest -q -rs

      - name: The window tests ran
        # ⚠️ -rs above prints skip reasons; this step fails the job if the Qt test files were skipped anyway
        # (PyQt5 missing or unable to start). These files use pytest.importorskip, which turns "PyQt5 is not
        # installed" into a green run that tested nothing. `shell: bash` makes the pipe fail if pytest fails.
        shell: bash
        run: |
          python -m pytest tests/test_ui_qt.py tests/test_task_dialog.py tests/test_review_dialog.py tests/test_panels_current.py \
            tests/test_app_icon.py tests/test_demo_showcase.py -q -p no:cacheprovider -rs | tee /tmp/qt.txt
          ! grep -qi "skipped" /tmp/qt.txt

  # ⚠️ This job exists for branch protection, and its name must not change. Same shape as `required` in the sibling
  # projects: one unmatrixed job that waits on the legs and asserts their result, so adding a Python version needs no
  # change to repository settings.
  required:
    name: unit tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every Python version passed
        # `needs` alone does not do this: with `if: always()` this job runs even when a leg failed or was
        # cancelled, so the result has to be asserted rather than assumed.
        run: |
          echo "test: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success" || exit 1
