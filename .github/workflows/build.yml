# The installer and launcher scripts, and the screenshot tool. Split from tests.yml so each gets its own badge and they
# run in parallel.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  scripts:
    name: installer and launcher scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: shellcheck
        # Preinstalled on the runner. The installer runs commands as root on someone's gaming machine, so it gets the
        # strictest reading available. The remote steps are heredocs, which shellcheck does not read; they are
        # checked with `sh -n` below.
        run: shellcheck deploy/install.sh deploy/scrappy.sh

      - name: Syntax with bash and with sh
        # install.sh and scrappy.sh must parse under bash (the Mac has 3.2, the box has bash). The launcher must also
        # parse under the plain sh of this runner (dash): it is started by the desktop shortcut.
        run: |
          bash -n deploy/install.sh
          bash -n deploy/scrappy.sh
          sh -n deploy/scrappy.sh

      - name: The pinned Pillow wheels download and match their pins
        # A dry run makes no connection to a Batocera, but it does fetch the pinned wheel into the cache and checks its
        # sha256, once per architecture. It also prints every remote step; those are kept for the next step.
        run: |
          export SCRAPPY_WHEEL_CACHE="$RUNNER_TEMP/wheels"
          SCRAPPY_ARCH=x86_64  deploy/install.sh --dry-run --no-probe > /tmp/dry-x86_64.txt
          SCRAPPY_ARCH=aarch64 deploy/install.sh --dry-run --no-probe > /tmp/dry-aarch64.txt
          deploy/install.sh --uninstall --dry-run > /tmp/dry-uninstall.txt
          grep -q 'sha256 matches the pin' /tmp/dry-x86_64.txt
          grep -q 'sha256 matches the pin' /tmp/dry-aarch64.txt

      - name: The remote steps parse as POSIX sh
        # What the installer sends over ssh runs under the box's sh, not bash. dash is the strictest sh on the runner.
        run: |
          for f in /tmp/dry-x86_64.txt /tmp/dry-aarch64.txt /tmp/dry-uninstall.txt; do
            test "$(grep -c '^    | ' "$f")" -gt 30
            sed -n 's/^    | //p' "$f" | sh -n
          done

  screenshots:
    name: screenshot tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 ffmpeg
      - run: python -m pip install -r requirements-dev.txt PyQt5

      - name: Make the six screenshots from the invented demo library
        # This is the same window the tests drive, on the library that ships in the repository (no real artwork, no
        # network). If a change breaks the window or the demo, this fails with the step that broke.
        run: python tools/make_screenshots.py --out /tmp/shots

      - name: Six pictures came out, and they are real PNGs
        run: |
          test "$(ls /tmp/shots/*.png | wc -l)" -eq 6
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = ["01-library", "02-current", "03-search-results", "04-review-dialog", "05-saved", "06-trailer"]
          for name in names:
              im = Image.open(Path("/tmp/shots") / (name + ".png"))
              im.load()
              assert im.format == "PNG" and im.width >= 400 and im.height >= 300, (name, im.format, im.size)
          print("six screenshots ok")
          PY

  # ⚠️ Same idea as `required` in tests.yml: one stable name for branch protection.
  required:
    name: build checks
    needs: [scripts, screenshots]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        run: |
          echo "scripts: ${{ needs.scripts.result }}, screenshots: ${{ needs.screenshots.result }}"
          test "${{ needs.scripts.result }}" = "success" || exit 1
          test "${{ needs.screenshots.result }}" = "success" || exit 1
