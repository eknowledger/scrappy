<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Scrappy">
  <title>Scrappy</title>
  <!-- A scrappy game cartridge: bevelled corner, grip ridges, a face, a strip of tape and a stitched-on patch.
       The patch is the missing artwork it has found; the spark says it was pleased about that. -->
  <g stroke="#1a1c22" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- connector -->
    <path d="M18 50h28v8a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2z" fill="#6b7280"/>
    <!-- body with a bevelled top-left corner -->
    <path d="M19 4h33a4 4 0 0 1 4 4v39a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V15z" fill="#ffc83d"/>
    <!-- label -->
    <rect x="14" y="13" width="36" height="24" rx="3" fill="#fff7dc"/>
  </g>
  <!-- grip ridges -->
  <g stroke="#1a1c22" stroke-width="1.8" stroke-linecap="round">
    <path d="M32 7.2h16M32 9.8h16" opacity=".85"/>
  </g>
  <!-- eyes -->
  <g fill="#1a1c22">
    <ellipse cx="25" cy="22.5" rx="3.3" ry="4.1"/>
    <ellipse cx="39" cy="22.5" rx="3.3" ry="4.1"/>
  </g>
  <g fill="#fff">
    <circle cx="26.2" cy="21" r="1.2"/>
    <circle cx="40.2" cy="21" r="1.2"/>
  </g>
  <!-- cheeky grin -->
  <path d="M24 30.2q8 6 16 0" fill="none" stroke="#1a1c22" stroke-width="2.4" stroke-linecap="round"/>
  <!-- tape over the bevelled corner -->
  <g transform="rotate(-45 12.5 10.5)">
    <rect x="3" y="7" width="19" height="7" rx="1" fill="#e8d9a8" stroke="#1a1c22" stroke-width="1.8"/>
    <path d="M7 7v7M12 7v7M17 7v7" stroke="#1a1c22" stroke-width="1" opacity=".35"/>
  </g>
  <!-- scrap patch, stitched on -->
  <path d="M37 34h15v14H37z" fill="#ff6b4a" stroke="#1a1c22" stroke-width="2.2" stroke-linejoin="round" transform="rotate(6 44.5 41)"/>
  <rect x="38.8" y="35.8" width="11.4" height="10.4" transform="rotate(6 44.5 41)" fill="none" stroke="#fff7dc" stroke-width="1.3"
        stroke-linecap="round" stroke-dasharray="1.6 2.2"/>
  <!-- spark -->
  <path d="M14 41l1.4 3.1 3.1 1.4-3.1 1.4L14 50l-1.4-3.1-3.1-1.4 3.1-1.4z" fill="#fff7dc" stroke="#1a1c22" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
